{% extends "base.html" %}
{% block content %}

<div class="auth-container">

    <div class="auth-card">
        <h2>Create Account</h2>

        <form method="POST">

            <input type="text"
                   name="name"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit" class="glow-btn">
                Register 🚀
            </button>

        </form>

        <p class="auth-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>

</div>

{% endblock %}
