{% extends "base.html" %}
{% block content %}

<div class="auth-container">

    <div class="auth-card">
        <h2>Login to Jobnexa 🔐</h2>

        <form method="POST">

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit" class="glow-btn">
                Login 🚀
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>

    </div>

</div>

{% endblock %}
